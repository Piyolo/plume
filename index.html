<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLUME — Vapour, refined.</title>
<meta name="description" content="PLUME. A design demo: a scroll-driven showcase for a fictional premium vape brand. No products are sold.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ================================================== AGE GATE ==== -->
<div class="gate" id="ageGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <div class="gate__panel">
    <p class="gate__brand mono">PLUME</p>

    <div class="gate__ask" id="gateAsk">
      <h1 class="gate__q" id="gateTitle">Are you 21 or older?</h1>
      <p class="gate__sub">This site contains content about nicotine products.</p>
      <div class="gate__actions">
        <button type="button" class="btn btn--solid" id="gateYes">Yes, I&#39;m 21</button>
        <button type="button" class="btn btn--ghost" id="gateNo">No, take me back</button>
      </div>
    </div>

    <div class="gate__ask" id="gateRefuse" hidden>
      <h1 class="gate__q">Come back when you&#39;re 21.</h1>
      <p class="gate__sub">Nothing to see here yet — not for you, not today.</p>
      <div class="gate__actions">
        <button type="button" class="btn btn--ghost" id="gateBack">Take me back</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/vendor/gsap.min.js"></script>
<script src="assets/vendor/ScrollTrigger.min.js"></script>
<script src="assets/vendor/lenis.min.js"></script>
<script src="js/data.js"></script>
<script src="js/cart-store.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
